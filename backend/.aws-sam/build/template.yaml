AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Live Prediction Arena - Backend API
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        MATCHES_TABLE:
          Ref: MatchesTable
        ROOMS_TABLE:
          Ref: RoomsTable
        ROUNDS_TABLE:
          Ref: RoundsTable
        CONNECTIONS_TABLE:
          Ref: ConnectionsTable
        USER_POOL_ID:
          Ref: CognitoUserPool
Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: lpa-users
      AutoVerifiedAttributes:
      - email
      UsernameAttributes:
      - email
      Schema:
      - Name: email
        Required: true
        Mutable: true
      - Name: name
        Required: false
        Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lpa-mobile-client
      UserPoolId:
        Ref: CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      - ALLOW_USER_SRP_AUTH
  MatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lpa-matches
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: matchId
        AttributeType: S
      - AttributeName: status
        AttributeType: S
      KeySchema:
      - AttributeName: matchId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: status-index
        KeySchema:
        - AttributeName: status
          KeyType: HASH
        Projection:
          ProjectionType: ALL
  RoomsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lpa-rooms
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: roomCode
        AttributeType: S
      - AttributeName: matchId
        AttributeType: S
      KeySchema:
      - AttributeName: roomCode
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: matchId-index
        KeySchema:
        - AttributeName: matchId
          KeyType: HASH
        Projection:
          ProjectionType: ALL
  RoundsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lpa-rounds
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: matchId
        AttributeType: S
      - AttributeName: roundNumber
        AttributeType: N
      KeySchema:
      - AttributeName: matchId
        KeyType: HASH
      - AttributeName: roundNumber
        KeyType: RANGE
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lpa-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: connectionId
        AttributeType: S
      KeySchema:
      - AttributeName: connectionId
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: '''GET,POST,OPTIONS'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: '''*'''
  GetMatchesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: matches.getMatches
      CodeUri: GetMatchesFunction
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: MatchesTable
      Events:
        GetMatches:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /matches
            Method: get
    Metadata:
      SamResourceId: GetMatchesFunction
  GetRoomsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rooms.getRooms
      CodeUri: GetRoomsFunction
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: RoomsTable
      Events:
        GetRooms:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /matches/{matchId}/rooms
            Method: get
    Metadata:
      SamResourceId: GetRoomsFunction
  CreateRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rooms.createRoom
      CodeUri: CreateRoomFunction
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: RoomsTable
      Events:
        CreateRoom:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /rooms
            Method: post
    Metadata:
      SamResourceId: CreateRoomFunction
  JoinRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rooms.joinRoom
      CodeUri: JoinRoomFunction
      Environment:
        Variables:
          CONNECTIONS_TABLE:
            Ref: ConnectionsTable
          WS_ENDPOINT:
            Fn::Sub: https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: RoomsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
      - Statement:
        - Effect: Allow
          Action: execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
      Events:
        JoinRoom:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /rooms/join/{roomCode}
            Method: post
    Metadata:
      SamResourceId: JoinRoomFunction
  GetRoundsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: rounds.getRounds
      CodeUri: GetRoundsFunction
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: RoundsTable
      Events:
        GetRounds:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /rounds/{matchId}
            Method: get
    Metadata:
      SamResourceId: GetRoundsFunction
  DflEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dfl-events.processEvents
      CodeUri: DflEventsFunction
      Timeout: 900
      Environment:
        Variables:
          CONNECTIONS_TABLE:
            Ref: ConnectionsTable
          WS_ENDPOINT:
            Fn::Sub: https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
      - S3ReadPolicy:
          BucketName: '*'
      - Statement:
        - Effect: Allow
          Action: execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
    Metadata:
      SamResourceId: DflEventsFunction
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: lpa-websocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: WebSocketApi
      StageName: prod
      AutoDeploy: true
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: websocket.connect
      CodeUri: ConnectFunction
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
    Metadata:
      SamResourceId: ConnectFunction
  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: websocket.disconnect
      CodeUri: DisconnectFunction
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
    Metadata:
      SamResourceId: DisconnectFunction
  MessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: websocket.message
      CodeUri: MessageFunction
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: RoomsTable
      - Statement:
        - Effect: Allow
          Action: execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*
    Metadata:
      SamResourceId: MessageFunction
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $connect
      Target:
        Fn::Sub: integrations/${ConnectIntegration}
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $disconnect
      Target:
        Fn::Sub: integrations/${DisconnectIntegration}
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $default
      Target:
        Fn::Sub: integrations/${MessageIntegration}
  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations
  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations
  MessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MessageFunction.Arn}/invocations
  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: ConnectFunction
      Principal: apigateway.amazonaws.com
  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: DisconnectFunction
      Principal: apigateway.amazonaws.com
  MessagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: MessageFunction
      Principal: apigateway.amazonaws.com
Outputs:
  RestApiUrl:
    Description: REST API endpoint
    Value:
      Fn::Sub: https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  WebSocketUrl:
    Description: WebSocket endpoint
    Value:
      Fn::Sub: wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value:
      Ref: CognitoUserPool
  CognitoClientId:
    Description: Cognito App Client ID
    Value:
      Ref: CognitoUserPoolClient
  MatchesTableName:
    Value:
      Ref: MatchesTable
  RoomsTableName:
    Value:
      Ref: RoomsTable
  RoundsTableName:
    Value:
      Ref: RoundsTable
